# 自动构建并部署品牌官网到 GitHub Pages
# 触发：push 到 main 分支，或手动运行（Actions 页面点 Run workflow）
#
# 部署地址：https://www.bluemcare.cn/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 自定义域名部署：basePath 为空（资源在根路径）
      NEXT_PUBLIC_BASE_PATH: ''
      # 站点绝对地址（OG 分享图等用）
      NEXT_PUBLIC_SITE_URL: https://www.bluemcare.cn
      # 要导出的品牌；新建品牌后改成对应 slug（brands/ 下的文件夹名）
      BRAND_SLUG: demo-brand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run export -- --brand=${{ env.BRAND_SLUG }}
      - name: 上传导出产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
